name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install VTK 9
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libvtk9-dev mpi-default-dev xvfb

      - name: Build and test (AddressSanitizer + UBSan)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Werror -fsanitize=address,undefined"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Compile the Leap backend against the stub SDK
        run: |
          cmake -S . -B build-leap -G Ninja -DLEAP_DICOM_WITH_LEAP=ON \
            -DLEAP_SDK_DIR=tests/fake_leap -DLEAP_DICOM_BUILD_TESTS=OFF -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build-leap

      - name: Render a synthetic CT phantom
        run: |
          pip install numpy pydicom pillow
          python tests/make_phantom.py build/phantom
          xvfb-run -a build/leap-dicom-viewer build/phantom --size 400x400 --screenshot build/phantom.png
          python -c "from PIL import Image; import numpy as n; a = n.asarray(Image.open('build/phantom.png').convert('L')); assert a.mean() > 10, a.mean(); print('mean brightness', a.mean())"

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-render
          path: build/phantom.png
